<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages — Client Bureau</title>
    <link rel="stylesheet" href="../common/imessage.css">
    <style>
        /* Mise en page de Messages sur macOS : barre latérale à gauche, conversation à droite */
        body { font-size: 14px; overflow: hidden; }

        #chatView { display: grid; grid-template-columns: 320px 1fr auto; height: 100vh; }

        aside {
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 12px 10px 8px;
            background: var(--sidebar-bg);
            border-right: 0.5px solid var(--separator);
        }
        .sidebar-header { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; }
        .sidebar-header .avatar { width: 32px; height: 32px; font-size: 13px; }
        .sidebar-header .me { flex: 1; min-width: 0; display: flex; flex-direction: column; }
        #meLabel { font-weight: 600; font-size: 13px; }

        #userList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 2px; }
        .contact {
            display: grid;
            grid-template-columns: 10px 40px 1fr;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 10px 10px 10px 4px;
            border: 0;
            border-radius: 10px;
            background: none;
            text-align: left;
        }
        .contact:not(.active):hover { background: rgba(0, 0, 0, 0.04); }
        .contact.active { background: var(--selection); color: #fff; }
        .contact.active .presence { color: rgba(255, 255, 255, 0.85); }
        .contact .chevron { display: none; }
        .row-text { display: flex; flex-direction: column; min-width: 0; }
        .row-text .name { font-weight: 600; font-size: 14px; }
        .row-text .presence { font-size: 13px; }
        .unread-dot { width: 10px; height: 10px; border-radius: 50%; }
        .unread-dot.visible { background: var(--blue); }

        .journal { padding: 6px 4px 0; border-top: 0.5px solid var(--separator); }

        main { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
        #emptyState { margin: auto; color: var(--secondary); font-size: 15px; }
        #conversation { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        /* En-tête centré (avatar puis nom dans une capsule), flottant au-dessus du fil */
        .conv-bar { display: flex; justify-content: center; padding: 4px 0 2px; }
        .contact-header .avatar { width: 44px; height: 44px; font-size: 17px; }
        #thread { padding-top: 100px; }

        /* Panneau d'informations à droite, comme dans Messages sur macOS */
        #infoPanel { width: 340px; border-left: 0.5px solid var(--separator); }

        .msg { font-size: 14px; max-width: 60%; }
    </style>
</head>
<body>
    <!-- 1. Connexion / création de compte (REST) -->
    <section id="authView" class="auth">
        <div class="app-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path fill="#fff" d="M24 7C13.5 7 5 14.2 5 23.1c0 5 2.7 9.5 7 12.5-.3 2.6-1.6 4.9-3.4 6.5 3.7-.2 7-1.6 9.4-3.8 1.9.5 3.9.8 6 .8 10.5 0 19-7.2 19-16S34.5 7 24 7z"/></svg>
        </div>
        <h1>Messages</h1>
        <p class="subtitle">Client bureau — connectez-vous ou créez un compte.</p>
        <form id="authForm">
            <div class="form-group">
                <div class="form-row">
                    <label for="username">Utilisateur</label>
                    <input id="username" required minlength="3" maxlength="50" autocomplete="username" placeholder="alice">
                </div>
                <div class="form-row">
                    <label for="password">Mot de passe</label>
                    <input id="password" type="password" required minlength="4" autocomplete="current-password" placeholder="4 caractères minimum">
                </div>
                <div class="form-row">
                    <label for="server">Serveur</label>
                    <input id="server" required>
                </div>
            </div>
            <p class="form-footnote">Sur l'autre appareil, ouvrez <code>/clients/mobile/</code> avec un second compte.</p>
            <button id="btnLogin" class="btn-primary" type="submit">Se connecter</button>
            <button id="btnRegister" class="btn-plain" type="submit">Créer un compte</button>
            <p id="authMessage"></p>
        </form>
    </section>

    <!-- 2. Messagerie -->
    <section id="chatView" hidden>
        <aside>
            <div class="sidebar-header">
                <span id="meAvatar" class="avatar"></span>
                <div class="me">
                    <span id="meLabel"></span>
                    <span id="wsStatus" class="ws-status"></span>
                </div>
                <button id="btnLogout" class="glass round" title="Se déconnecter" aria-label="Se déconnecter">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4"/><path d="M9 16l-4-4 4-4"/><path d="M5 12h10"/></svg>
                </button>
            </div>
            <ul id="userList"></ul>
            <details class="journal">
                <summary>Journal REST / WebSocket</summary>
                <ol id="log" reversed></ol>
            </details>
        </aside>

        <main>
            <p id="emptyState">Sélectionnez une conversation</p>
            <div id="conversation" hidden>
                <header class="conv-bar">
                    <button id="btnContactInfo" class="contact-header" aria-controls="infoPanel" aria-expanded="false" title="Informations sur le contact">
                        <span id="contactAvatar" class="avatar"></span>
                        <span class="glass"><span id="contactName"></span><span class="chev">›</span></span>
                        <span id="contactPresence" class="presence"></span>
                    </button>
                </header>
                <div id="thread">
                    <ul id="messages"></ul>
                    <div id="typing" class="typing" hidden><span></span><span></span><span></span></div>
                </div>
                <p id="composerError"></p>
                <form id="sendForm" class="composer">
                    <div class="composer-field">
                        <input id="messageInput" placeholder="Message" autocomplete="off" maxlength="5000">
                        <button id="btnSend" type="submit" aria-label="Envoyer">
                            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M2.5 6.5L7 2l4.5 4.5"/></svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <section id="infoPanel" aria-label="Informations sur le contact" hidden>
            <button id="btnCloseInfo" class="glass round" aria-label="Fermer">
                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
            </button>
            <div class="info-head">
                <span id="infoAvatar" class="avatar"></span>
                <h2 id="infoName"></h2>
                <span id="infoPresence" class="presence"></span>
            </div>
            <div id="infoBody"></div>
        </section>
    </section>

    <script type="module">
        import { initChat } from "../common/chat.js";
        initChat();
    </script>
</body>
</html>
