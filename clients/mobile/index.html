<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Messages — Client Mobile</title>
    <link rel="stylesheet" href="../common/imessage.css">
    <style>
        /* Mise en page de Messages sur iOS : liste des conversations OU conversation */
        body { font-size: 17px; }
        .auth { padding-top: max(32px, env(safe-area-inset-top)); }

        #chatView { height: 100dvh; display: flex; flex-direction: column; }
        body.in-conversation aside { display: none; }
        body:not(.in-conversation) main { display: none; }

        /* --- Liste des conversations --- */
        aside {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow-y: auto;
            padding: max(10px, env(safe-area-inset-top)) 0 env(safe-area-inset-bottom);
        }
        .top-bar { display: flex; padding: 4px 16px; }
        .large-title { margin: 8px 16px 2px; font-size: 34px; font-weight: 700; letter-spacing: 0.3px; }
        .me-line { margin: 0 16px 10px; font-size: 13px; color: var(--secondary); }
        #meLabel { color: var(--text); font-weight: 600; }

        .contact {
            display: grid;
            grid-template-columns: 12px auto 1fr auto;
            align-items: center;
            width: 100%;
            padding: 0 16px 0 4px;
            border: 0;
            background: none;
            text-align: left;
        }
        .contact:active { background: var(--bubble-received); }
        .contact .avatar { width: 46px; height: 46px; margin: 0 12px 0 6px; font-size: 18px; }
        .row-text {
            display: flex;
            flex-direction: column;
            min-width: 0;
            padding: 14px 0;
            border-bottom: 0.5px solid var(--separator);
            align-self: stretch;
            justify-content: center;
        }
        .row-text .name { font-weight: 600; font-size: 17px; }
        .row-text .presence { font-size: 15px; }
        .contact .chevron {
            align-self: stretch;
            display: flex;
            align-items: center;
            padding-left: 6px;
            border-bottom: 0.5px solid var(--separator);
            color: var(--disabled);
            font-size: 22px;
        }
        .unread-dot { width: 10px; height: 10px; border-radius: 50%; justify-self: end; }
        .unread-dot.visible { background: var(--blue); }

        .journal { margin-top: auto; padding: 16px; }

        /* --- Conversation --- */
        main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #emptyState { display: none; }
        #conversation { flex: 1; display: flex; flex-direction: column; min-height: 0; }

        .conv-header {
            display: grid;
            grid-template-columns: 52px 1fr 52px;
            align-items: start;
            padding: max(8px, env(safe-area-inset-top)) 8px 4px;
        }
        #btnBack { margin-top: 14px; color: var(--blue); }
        #btnBack svg { width: 20px; height: 20px; }
        .contact-header { justify-self: center; }
        .contact-header .avatar { width: 50px; height: 50px; font-size: 19px; }

        /* Le fil défile sous l'en-tête flouté */
        #thread { padding: calc(max(8px, env(safe-area-inset-top)) + 104px) 16px 12px; }

        /* Fiche du contact : feuille plein écran qui monte, comme sur iOS */
        #infoPanel {
            position: fixed;
            inset: 0;
            z-index: 10;
            padding-top: max(14px, env(safe-area-inset-top));
            padding-bottom: max(24px, env(safe-area-inset-bottom));
            animation: sheet-up 0.28s ease-out;
        }
        #btnCloseInfo { top: max(12px, env(safe-area-inset-top)); left: 16px; }
        @keyframes sheet-up { from { transform: translateY(100%); } to { transform: none; } }
        .msg { max-width: 75%; }
        .composer { padding-bottom: max(10px, env(safe-area-inset-bottom)); }
        .composer-field { min-height: 38px; }
        #btnSend { width: 30px; height: 30px; }
    </style>
</head>
<body>
    <!-- 1. Connexion / création de compte (REST) -->
    <section id="authView" class="auth">
        <div class="app-icon" aria-hidden="true">
            <svg viewBox="0 0 48 48"><path fill="#fff" d="M24 7C13.5 7 5 14.2 5 23.1c0 5 2.7 9.5 7 12.5-.3 2.6-1.6 4.9-3.4 6.5 3.7-.2 7-1.6 9.4-3.8 1.9.5 3.9.8 6 .8 10.5 0 19-7.2 19-16S34.5 7 24 7z"/></svg>
        </div>
        <h1>Messages</h1>
        <p class="subtitle">Client mobile — connectez-vous ou créez un compte.</p>
        <form id="authForm">
            <div class="form-group">
                <div class="form-row">
                    <label for="username">Utilisateur</label>
                    <input id="username" required minlength="3" maxlength="50" autocomplete="username" autocapitalize="none" placeholder="bob">
                </div>
                <div class="form-row">
                    <label for="password">Mot de passe</label>
                    <input id="password" type="password" required minlength="4" autocomplete="current-password" placeholder="Requis">
                </div>
                <div class="form-row">
                    <label for="server">Serveur</label>
                    <input id="server" required inputmode="url" autocapitalize="none">
                </div>
            </div>
            <p class="form-footnote">Pas encore de compte ? Remplissez les champs puis « Créer un compte ».</p>
            <button id="btnLogin" class="btn-primary" type="submit">Se connecter</button>
            <button id="btnRegister" class="btn-plain" type="submit">Créer un compte</button>
            <p id="authMessage"></p>
        </form>
    </section>

    <!-- 2. Messagerie -->
    <section id="chatView" hidden>
        <aside>
            <div class="top-bar">
                <button id="btnLogout" class="glass">Déconnexion</button>
            </div>
            <h1 class="large-title">Messages</h1>
            <p class="me-line"><span id="meLabel"></span> · <span id="wsStatus" class="ws-status"></span></p>
            <ul id="userList"></ul>
            <details class="journal">
                <summary>Journal REST / WebSocket</summary>
                <ol id="log" reversed></ol>
            </details>
        </aside>

        <main>
            <p id="emptyState"></p>
            <div id="conversation" hidden>
                <header class="conv-header conv-bar">
                    <button id="btnBack" class="glass round" aria-label="Retour aux conversations">
                        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 3.5L6 10l6.5 6.5"/></svg>
                    </button>
                    <button id="btnContactInfo" class="contact-header" aria-controls="infoPanel" aria-expanded="false" title="Informations sur le contact">
                        <span id="contactAvatar" class="avatar"></span>
                        <span class="glass"><span id="contactName"></span><span class="chev">›</span></span>
                        <span id="contactPresence" class="presence"></span>
                    </button>
                </header>
                <div id="thread">
                    <ul id="messages"></ul>
                    <div id="typing" class="typing" hidden><span></span><span></span><span></span></div>
                </div>
                <p id="composerError"></p>
                <form id="sendForm" class="composer">
                    <div class="composer-field">
                        <input id="messageInput" placeholder="Message" autocomplete="off" maxlength="5000">
                        <button id="btnSend" type="submit" aria-label="Envoyer">
                            <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12V2M2.5 6.5L7 2l4.5 4.5"/></svg>
                        </button>
                    </div>
                </form>
            </div>
        </main>

        <section id="infoPanel" aria-label="Informations sur le contact" hidden>
            <button id="btnCloseInfo" class="glass round" aria-label="Fermer">
                <svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 2l10 10M12 2L2 12"/></svg>
            </button>
            <div class="info-head">
                <span id="infoAvatar" class="avatar"></span>
                <h2 id="infoName"></h2>
                <span id="infoPresence" class="presence"></span>
            </div>
            <div id="infoBody"></div>
        </section>
    </section>

    <script type="module">
        import { initChat } from "../common/chat.js";
        initChat({
            onConversationOpened: () => document.body.classList.add("in-conversation"),
            onConversationClosed: () => document.body.classList.remove("in-conversation"),
        });
    </script>
</body>
</html>
