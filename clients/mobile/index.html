<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messagerie — Client Mobile</title>
    <style>
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        body { margin: 0; font-family: system-ui, sans-serif; background: #fff; color: #222; font-size: 16px; }
        h1 { font-size: 18px; margin: 0; }
        input, button { font: inherit; padding: 10px 12px; }
        button { cursor: pointer; }
        .error { color: #c62828; }
        .online { color: #2e7d32; }
        .hint { color: #777; font-size: 14px; }

        /* Connexion */
        #authView { padding: 20px 16px; }
        #authForm label { display: block; margin-top: 12px; font-size: 14px; }
        #authForm input { width: 100%; }
        .actions { display: flex; flex-direction: column; gap: 8px; margin-top: 18px; }

        /* Une seule colonne : liste des contacts OU conversation */
        #chatView { height: 100dvh; display: flex; flex-direction: column; }
        #chatView > header { padding: 10px 16px; background: #1976d2; color: #fff; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; }
        #chatView > header .spacer { flex: 1; }
        #chatView > header button { padding: 6px 10px; }
        #wsStatus { font-size: 13px; width: 100%; }
        #wsStatus.online { color: #c8e6c9; }

        aside { padding: 12px 16px; flex: 1; overflow-y: auto; }
        body.in-conversation aside { display: none; }
        body:not(.in-conversation) main { display: none; }
        #userList { list-style: none; margin: 0; padding: 0; }
        .contact { width: 100%; display: flex; align-items: center; gap: 10px; background: none; border: none; border-bottom: 1px solid #eee; text-align: left; padding: 14px 4px; }
        .contact .name { flex: 1; font-weight: 500; }
        .dot { width: 12px; height: 12px; border-radius: 50%; background: #bbb; }
        .dot.online { background: #2e7d32; }
        .unread { background: #c62828; color: #fff; border-radius: 10px; padding: 0 8px; font-size: 13px; }

        main { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        #emptyState { display: none; }
        #conversation { display: flex; flex-direction: column; flex: 1; min-height: 0; }
        #conversation > header { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid #ddd; }
        #messages { list-style: none; margin: 0; padding: 12px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background: #f4f4f4; }
        .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-wrap: break-word; }
        .msg.mine { align-self: flex-end; background: #1976d2; color: #fff; }
        .msg.theirs { align-self: flex-start; background: #fff; border: 1px solid #ddd; }
        .meta { font-size: 11px; opacity: .8; margin-top: 2px; text-align: right; }
        .status[data-statut="lu"] { font-weight: bold; }
        #typing, #composerError { margin: 0 12px; min-height: 18px; font-size: 13px; }
        #typing { color: #777; font-style: italic; }
        #sendForm { display: flex; gap: 8px; padding: 8px 12px; border-top: 1px solid #ddd; }
        #messageInput { flex: 1; min-width: 0; }

        details { border-top: 1px solid #ddd; padding: 6px 16px; font-size: 12px; }
        #log { max-height: 100px; overflow-y: auto; margin: 6px 0 0; padding-left: 18px; }
    </style>
</head>
<body>
    <!-- 1. Connexion / création de compte (REST) -->
    <section id="authView">
        <h1>📱 Messagerie — Mobile</h1>
        <form id="authForm">
            <label>Serveur <input id="server" required inputmode="url"></label>
            <label>Nom d'utilisateur <input id="username" required minlength="3" maxlength="50" autocomplete="username" autocapitalize="none"></label>
            <label>Mot de passe <input id="password" type="password" required minlength="4" autocomplete="current-password"></label>
            <div class="actions">
                <button id="btnLogin" type="submit">Se connecter</button>
                <button id="btnRegister" type="submit">Créer un compte</button>
            </div>
            <p id="authMessage"></p>
        </form>
        <p class="hint">Pas encore de compte ? Remplissez les champs puis « Créer un compte ».</p>
    </section>

    <!-- 2. Messagerie -->
    <section id="chatView" hidden>
        <header>
            <h1>📱 <span id="meLabel"></span></h1>
            <span class="spacer"></span>
            <button id="btnLogout">Déconnexion</button>
            <span id="wsStatus"></span>
        </header>

        <aside>
            <ul id="userList"></ul>
            <p class="hint">Touchez un contact pour ouvrir la conversation. Point vert = en ligne.</p>
            <p class="hint">Statuts : ✓ envoyé · ✓✓ livré · <b>✓✓ lu</b></p>
        </aside>

        <main>
            <p id="emptyState"></p>
            <div id="conversation" hidden>
                <header>
                    <button id="btnBack" aria-label="Retour aux contacts">←</button>
                    <div><strong id="contactName"></strong><br><small id="contactPresence"></small></div>
                </header>
                <ul id="messages"></ul>
                <p id="typing"></p>
                <p id="composerError" class="error"></p>
                <form id="sendForm">
                    <input id="messageInput" placeholder="Message…" autocomplete="off" maxlength="5000">
                    <button id="btnSend" type="submit">Envoyer</button>
                </form>
            </div>
        </main>

        <details>
            <summary>Journal REST / WebSocket</summary>
            <ol id="log" reversed></ol>
        </details>
    </section>

    <script type="module">
        import { initChat } from "../common/chat.js";
        initChat({
            onConversationOpened: () => document.body.classList.add("in-conversation"),
            onConversationClosed: () => document.body.classList.remove("in-conversation"),
        });
    </script>
</body>
</html>
